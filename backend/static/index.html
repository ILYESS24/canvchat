<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortix AI - Ignite Curiosity</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
        }
        
        .container {
            min-height: 100vh;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 4rem;
            font-style: italic;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
        }
        
        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px 24px;
            margin-bottom: 24px;
        }
        
        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 8px 0;
            outline: none;
        }
        
        .input-field::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .btn-send {
            background: rgba(255,255,255,0.9);
            color: #000;
        }
        
        .btn-send:hover {
            background: #fff;
            transform: scale(1.05);
        }
        
        .btn-send:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            transform: none;
        }
        
        .bubbles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
        }
        
        .bubble {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
        }
        
        .bubble:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .bubble.active {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.95);
        }
        
        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 16px;
        }
        
        /* Chat styles */
        .chat-container {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        
        .chat-container.active {
            display: flex;
        }
        
        .landing.hidden {
            display: none;
        }
        
        .chat-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            max-width: 80%;
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
        }
        
        .message.user {
            margin-left: auto;
            background: rgba(99,102,241,0.2);
            border: 1px solid rgba(99,102,241,0.3);
        }
        
        .message.assistant {
            margin-right: auto;
        }
        
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .chat-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        
        .chat-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .model-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }
        
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .typing span {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
        
        <!-- Landing Page -->
        <div class="content landing" id="landing">
            <h1 class="title">Ignite curiosity</h1>
            
            <div class="input-container">
                <div class="input-row">
                    <button class="btn" onclick="document.getElementById('fileInput').click()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" style="display:none" multiple>
                    
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="input-field" 
                        placeholder="How can I help you today?"
                        onkeydown="if(event.key === 'Enter') sendMessage()"
                    >
                    
                    <button class="btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        </svg>
                    </button>
                    
                    <button class="btn btn-send" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="bubbles">
                <div class="bubble" onclick="selectBubble(this, 'slides', 'Crée une présentation de 5 slides sur : ')">
                    <span>📊</span><span>Slides</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'code', 'Écris du code propre pour : ')">
                    <span>💻</span><span>Code</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'analyse', 'Analyse en détail : ')">
                    <span>📈</span><span>Analyse</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'redaction', 'Rédige un texte professionnel sur : ')">
                    <span>✍️</span><span>Rédaction</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'creative', 'Génère des idées créatives pour : ')">
                    <span>🎨</span><span>Créatif</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'traduction', 'Traduis en anglais, espagnol et allemand : ')">
                    <span>🌐</span><span>Traduction</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'resume', 'Fais un résumé de : ')">
                    <span>📝</span><span>Résumé</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'math', 'Résous ce problème mathématique : ')">
                    <span>🔢</span><span>Maths</span>
                </div>
            </div>
            
            <p class="hint">Clique sur une bulle ou écris directement • Enter pour envoyer</p>
        </div>
        
        <!-- Chat Page -->
        <div class="chat-container" id="chat">
            <div class="chat-header">
                <div style="display:flex;align-items:center;gap:12px">
                    <span style="font-size:24px">🎨</span>
                    <span style="font-weight:500">Kortix AI</span>
                </div>
                <button class="btn" onclick="newChat()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-area">
                <textarea 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Décris ce dont tu as besoin..."
                    rows="2"
                    onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendChatMessage(); }"
                ></textarea>
            </div>
        </div>
    </div>
    
    <script>
        // État de l'application
        let activeBubble = null;
        let activePrompt = '';
        let messages = [];
        let isGenerating = false;
        let currentModel = { name: 'Claude 3.5 Sonnet', emoji: '🤖' };
        
        const OPENROUTER_API_KEY = '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';
        
        // Sélection du meilleur modèle selon la tâche
        function selectBestModel(query) {
            const q = query.toLowerCase();
            
            if (q.includes('slide') || q.includes('présentation') || q.includes('ppt')) {
                return { id: 'openai/gpt-4-turbo', name: 'GPT-4 Turbo', emoji: '📊' };
            }
            if (q.includes('code') || q.includes('fonction') || q.includes('script') || q.includes('debug')) {
                return { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5', emoji: '💻' };
            }
            if (q.includes('tradui') || q.includes('translat')) {
                return { id: 'openai/gpt-4o-mini', name: 'GPT-4o Mini', emoji: '🌐' };
            }
            if (q.includes('résumé') || q.includes('summary')) {
                return { id: 'openai/gpt-4o-mini', name: 'GPT-4o Mini', emoji: '📝' };
            }
            if (q.includes('math') || q.includes('calcul') || q.includes('équation')) {
                return { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5', emoji: '🔢' };
            }
            return { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5', emoji: '🤖' };
        }
        
        // Sélectionner une bulle
        function selectBubble(element, type, prompt) {
            document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            activeBubble = type;
            activePrompt = prompt;
            document.getElementById('messageInput').placeholder = 'Complète ta demande...';
            document.getElementById('messageInput').focus();
        }
        
        // Envoyer un message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            let message = input.value.trim();
            
            if (!message) return;
            
            // Ajouter le prompt de la bulle si active
            if (activePrompt) {
                message = activePrompt + message;
            }
            
            // Passer en mode chat
            document.getElementById('landing').classList.add('hidden');
            document.getElementById('chat').classList.add('active');
            
            // Envoyer le message
            addMessage('user', message);
            input.value = '';
            activeBubble = null;
            activePrompt = '';
            
            // Appeler l'API
            callOpenRouter(message);
        }
        
        // Envoyer un message depuis le chat
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || isGenerating) return;
            
            addMessage('user', message);
            input.value = '';
            callOpenRouter(message);
        }
        
        // Ajouter un message au chat
        function addMessage(role, content) {
            messages.push({ role, content });
            
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;
            
            if (role === 'assistant') {
                msgDiv.innerHTML = `
                    <div class="model-badge">
                        <span>${currentModel.emoji}</span>
                        <span>${currentModel.name}</span>
                    </div>
                    <div class="message-content">${formatContent(content)}</div>
                `;
            } else {
                msgDiv.innerHTML = `<div class="message-content">${formatContent(content)}</div>`;
            }
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Formater le contenu (basique)
        function formatContent(content) {
            return content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>')
                .replace(/```([\s\S]*?)```/g, '<pre style="background:#1e1e2e;padding:12px;border-radius:8px;overflow-x:auto">$1</pre>');
        }
        
        // Appeler OpenRouter
        async function callOpenRouter(userMessage) {
            isGenerating = true;
            currentModel = selectBestModel(userMessage);
            
            // Afficher le loader
            const chatMessages = document.getElementById('chatMessages');
            const loader = document.createElement('div');
            loader.className = 'loading';
            loader.id = 'loader';
            loader.innerHTML = `<div class="spinner"></div> ${currentModel.emoji} ${currentModel.name} génère...`;
            chatMessages.appendChild(loader);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + OPENROUTER_API_KEY,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Kortix AI'
                    },
                    body: JSON.stringify({
                        model: currentModel.id,
                        messages: [
                            { role: 'system', content: 'Tu es un assistant IA polyvalent. Réponds de manière claire et utile avec des emojis.' },
                            ...messages.map(m => ({ role: m.role, content: m.content }))
                        ],
                        stream: true,
                        temperature: 0.7,
                        max_tokens: 4000
                    })
                });
                
                // Supprimer le loader
                document.getElementById('loader')?.remove();
                
                // Créer le message assistant
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'message assistant';
                assistantDiv.innerHTML = `
                    <div class="model-badge">
                        <span>${currentModel.emoji}</span>
                        <span>${currentModel.name}</span>
                    </div>
                    <div class="message-content" id="streamContent"></div>
                `;
                chatMessages.appendChild(assistantDiv);
                
                // Lire le stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const json = JSON.parse(line.slice(6));
                                const content = json.choices?.[0]?.delta?.content || '';
                                if (content) {
                                    fullContent += content;
                                    document.getElementById('streamContent').innerHTML = formatContent(fullContent);
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                messages.push({ role: 'assistant', content: fullContent });
                
            } catch (error) {
                document.getElementById('loader')?.remove();
                addMessage('assistant', '❌ Erreur: ' + error.message);
            }
            
            isGenerating = false;
        }
        
        // Nouvelle conversation
        function newChat() {
            messages = [];
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chat').classList.remove('active');
            document.getElementById('landing').classList.remove('hidden');
            document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
            activeBubble = null;
            activePrompt = '';
        }
    </script>
</body>
</html>
