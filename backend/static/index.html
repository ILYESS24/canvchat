<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortix AI - Ignite Curiosity</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
        }
        
        .container {
            min-height: 100vh;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 4rem;
            font-style: italic;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
        }
        
        .input-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px 24px;
            margin-bottom: 24px;
        }
        
        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 8px 0;
            outline: none;
        }
        
        .input-field::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .btn-send {
            background: rgba(255,255,255,0.9);
            color: #000;
        }
        
        .btn-send:hover {
            background: #fff;
            transform: scale(1.05);
        }
        
        .btn-send:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            transform: none;
        }
        
        .bubbles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
        }
        
        .bubble {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
        }
        
        .bubble:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .bubble.active {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.95);
        }
        
        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 16px;
        }
        
        /* Chat styles */
        .chat-container {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        
        .chat-container.active {
            display: flex;
        }
        
        .landing.hidden {
            display: none;
        }
        
        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            max-width: 75%;
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message.user {
            margin-left: auto;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .message.assistant {
            margin-right: auto;
        }
        
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: transparent;
        }
        
        .chat-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            resize: none;
            outline: none;
            transition: all 0.3s;
            min-height: 40px;
            max-height: 150px;
        }
        
        .chat-input:focus {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }
        
        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .chat-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 6px;
            font-weight: 300;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .typing span {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            font-weight: 300;
            padding: 8px 0;
        }
        
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
        
        <!-- Landing Page -->
        <div class="content landing" id="landing">
            <h1 class="title">Ignite curiosity</h1>
            
            <div class="input-container">
                <div class="input-row">
                    <button class="btn" onclick="document.getElementById('fileInput').click()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" style="display:none" multiple>
                    
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="input-field" 
                        placeholder="How can I help you today?"
                        onkeydown="if(event.key === 'Enter') sendMessage()"
                    >
                    
                    <button class="btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        </svg>
                    </button>
                    
                    <button class="btn btn-send" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="bubbles">
                <div class="bubble" onclick="selectBubble(this, 'slides', 'Create a 5-slide presentation about: ')">
                    <span>Slides</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'code', 'Write clean code for: ')">
                    <span>Code</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'analyse', 'Analyze in detail: ')">
                    <span>Analysis</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'redaction', 'Write a professional text about: ')">
                    <span>Writing</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'creative', 'Generate creative ideas for: ')">
                    <span>Creative</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'traduction', 'Translate to English, Spanish and German: ')">
                    <span>Translation</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'resume', 'Summarize: ')">
                    <span>Summary</span>
                </div>
                <div class="bubble" onclick="selectBubble(this, 'math', 'Solve this math problem: ')">
                    <span>Math</span>
                </div>
            </div>
            
            <p class="hint">Click a bubble or type directly • Press Enter to send</p>
        </div>
        
        <!-- Chat Page -->
        <div class="chat-container" id="chat">
            <div class="chat-header">
                <button class="btn" onclick="newChat()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-area">
                <div style="display: flex; align-items: flex-end; gap: 8px; width: 100%;">
                    <textarea 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="Type your message... (Enter to send)"
                        rows="1"
                        oninput="this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 150) + 'px';"
                        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendChatMessage(); }"
                        onfocus="console.log('🔵 Textarea chat focused')"
                        style="flex: 1;"
                    ></textarea>
                    <button 
                        class="btn btn-send" 
                        onclick="sendChatMessage()"
                        id="chatSendBtn"
                        style="margin-bottom: 4px; min-width: 36px; height: 36px; padding: 8px;"
                        title="Send (Enter)"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // État de l'application
        let activeBubble = null;
        let activePrompt = '';
        let messages = [];
        let isGenerating = false;
        let currentModel = { name: 'Claude 3.5 Sonnet', emoji: '🤖' };
        
        // Note: API key is now configured in backend/.env (not in frontend for security)
        // The frontend calls the backend API at /v1/chat/completions
        
        // Sélection du meilleur modèle selon la tâche
        function selectBestModel(query) {
            const q = query.toLowerCase();
            
            if (q.includes('slide') || q.includes('présentation') || q.includes('ppt')) {
                return { id: 'openai/gpt-4-turbo', name: 'GPT-4 Turbo', emoji: '📊' };
            }
            if (q.includes('code') || q.includes('fonction') || q.includes('script') || q.includes('debug')) {
                return { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5', emoji: '💻' };
            }
            if (q.includes('tradui') || q.includes('translat')) {
                return { id: 'openai/gpt-4o-mini', name: 'GPT-4o Mini', emoji: '🌐' };
            }
            if (q.includes('résumé') || q.includes('summary')) {
                return { id: 'openai/gpt-4o-mini', name: 'GPT-4o Mini', emoji: '📝' };
            }
            if (q.includes('math') || q.includes('calcul') || q.includes('équation')) {
                return { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5', emoji: '🔢' };
            }
            return { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5', emoji: '🤖' };
        }
        
        // Select a bubble
        function selectBubble(element, type, prompt) {
            document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            activeBubble = type;
            activePrompt = prompt;
            document.getElementById('messageInput').placeholder = 'Complete your request...';
            document.getElementById('messageInput').focus();
        }
        
        // Envoyer un message
        function sendMessage() {
            console.log('📤 sendMessage() appelée');
            const input = document.getElementById('messageInput');
            let message = input.value.trim();
            console.log('📝 Message saisi:', message);
            
            if (!message) {
                console.log('⚠️ Message vide, annulation');
                return;
            }
            
            // Ajouter le prompt de la bulle si active
            if (activePrompt) {
                message = activePrompt + message;
            }
            
            // Passer en mode chat
            document.getElementById('landing').classList.add('hidden');
            document.getElementById('chat').classList.add('active');
            
            // Envoyer le message
            addMessage('user', message);
            input.value = '';
            activeBubble = null;
            activePrompt = '';
            
            // Appeler l'API
            callOpenRouter(message);
        }
        
        // Send message from chat
        function sendChatMessage() {
            console.log('📤 sendChatMessage() called from chat');
            const input = document.getElementById('chatInput');
            
            if (!input) {
                console.error('❌ chatInput element not found!');
                return;
            }
            
            const message = input.value.trim();
            console.log('📝 Chat message:', message);
            console.log('⏳ isGenerating:', isGenerating);
            
            if (!message) {
                console.log('⚠️ Empty message, canceling');
                return;
            }
            
            if (isGenerating) {
                console.log('⚠️ Generation in progress, canceling');
                alert('⏳ Wait for AI to finish responding!');
                return;
            }
            
            console.log('✅ Sending message...');
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto'; // Reset height
            callOpenRouter(message);
        }
        
        // Status messages
        const statusMessages = [
            'Configuring AI',
            'Analyzing',
            'Processing request',
            'Generating response',
            'Optimizing result',
            'Finalizing'
        ];
        
        function getRandomStatus() {
            return statusMessages[Math.floor(Math.random() * statusMessages.length)];
        }
        
        // Ajouter un message au chat
        function addMessage(role, content, showStatus = false) {
            messages.push({ role, content });
            
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;
            
            if (role === 'assistant') {
                const statusHtml = showStatus ? `
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span>${getRandomStatus()}...</span>
                    </div>
                ` : '';
                msgDiv.innerHTML = `
                    ${statusHtml}
                    <div class="message-content">${formatContent(content)}</div>
                `;
            } else {
                msgDiv.innerHTML = `<div class="message-content">${formatContent(content)}</div>`;
            }
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Formater le contenu (basique)
        function formatContent(content) {
            return content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>')
                .replace(/```([\s\S]*?)```/g, '<pre style="background:#1e1e2e;padding:12px;border-radius:8px;overflow-x:auto">$1</pre>');
        }
        
        // Mettre à jour l'état des boutons d'envoi
        function updateSendButtons() {
            const sendBtn = document.getElementById('sendBtn');
            const chatSendBtn = document.getElementById('chatSendBtn');
            const chatInput = document.getElementById('chatInput');
            
            if (isGenerating) {
                if (sendBtn) sendBtn.disabled = true;
                if (chatSendBtn) {
                    chatSendBtn.disabled = true;
                    chatSendBtn.style.opacity = '0.5';
                    chatSendBtn.style.cursor = 'not-allowed';
                }
                if (chatInput) chatInput.disabled = true;
            } else {
                if (sendBtn) sendBtn.disabled = false;
                if (chatSendBtn) {
                    chatSendBtn.disabled = false;
                    chatSendBtn.style.opacity = '1';
                    chatSendBtn.style.cursor = 'pointer';
                }
                if (chatInput) {
                    chatInput.disabled = false;
                    chatInput.focus();
                }
            }
        }
        
        // Appeler le backend FastAPI (qui gère OpenRouter)
        async function callOpenRouter(userMessage) {
            console.log('🚀 Envoi du message:', userMessage);
            isGenerating = true;
            updateSendButtons();
            currentModel = selectBestModel(userMessage);
            console.log('📊 Modèle sélectionné:', currentModel);
            
            // Afficher le loader minimal
            const chatMessages = document.getElementById('chatMessages');
            const loader = document.createElement('div');
            loader.className = 'loading';
            loader.id = 'loader';
            loader.innerHTML = `<div class="spinner"></div> ${getRandomStatus()}...`;
            chatMessages.appendChild(loader);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            try {
                console.log('🌐 Appel API vers /v1/chat/completions...');
                // Appel au backend FastAPI local
                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: currentModel.id,
                        messages: [
                            { role: 'system', content: 'Tu es un assistant IA polyvalent. Réponds de manière claire et utile.' },
                            ...messages.map(m => ({ role: m.role, content: m.content }))
                        ],
                        stream: true,
                        temperature: 0.7,
                        max_tokens: 400  // Réduit pour économiser les crédits
                    })
                });
                
                console.log('✅ Réponse reçue:', response.status, response.statusText);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Erreur HTTP:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                // Supprimer le loader
                document.getElementById('loader')?.remove();
                
                // Créer le message assistant
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'message assistant';
                assistantDiv.innerHTML = `
                    <div class="message-content" id="streamContent"></div>
                `;
                chatMessages.appendChild(assistantDiv);
                
                console.log('📥 Lecture du stream...');
                // Lire le stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let chunkCount = 0;
                
                // Timeout de sécurité : 30 secondes max
                const streamTimeout = setTimeout(() => {
                    console.error('⏰ Timeout du stream après 30 secondes');
                    reader.cancel();
                }, 30000);
                
                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) {
                            console.log('✅ Stream done signal reçu');
                            break;
                        }
                        
                        chunkCount++;
                        const chunk = decoder.decode(value);
                        console.log(`📦 Chunk ${chunkCount}:`, chunk.substring(0, 100) + '...');
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.trim() === 'data: [DONE]') {
                                console.log('✅ [DONE] signal reçu, fin du stream');
                                break;
                            }
                            
                            if (line.startsWith('data: ') && line.trim() !== 'data:') {
                                try {
                                    const json = JSON.parse(line.slice(6));
                                    
                                    // Gestion des erreurs dans le stream
                                    if (json.error) {
                                        console.error('❌ Erreur dans le stream:', json.error);
                                        throw new Error(json.error.message || json.error);
                                    }
                                    
                                    const content = json.choices?.[0]?.delta?.content || '';
                                    if (content) {
                                        fullContent += content;
                                        const streamElem = document.getElementById('streamContent');
                                        if (streamElem) {
                                            streamElem.innerHTML = formatContent(fullContent);
                                            chatMessages.scrollTop = chatMessages.scrollHeight;
                                        }
                                    }
                                } catch (e) {
                                    console.warn('⚠️ Parse error:', e, 'Line:', line);
                                }
                            }
                        }
                    }
                } finally {
                    clearTimeout(streamTimeout);
                }
                
                console.log(`✅ Stream terminé après ${chunkCount} chunks`);
                console.log('📝 Contenu complet (100 premiers chars):', fullContent.substring(0, 100) + '...');
                console.log('📏 Longueur totale:', fullContent.length, 'caractères');
                
                if (fullContent) {
                    messages.push({ role: 'assistant', content: fullContent });
                } else {
                    console.warn('⚠️ No content received from stream!');
                    addMessage('assistant', '⚠️ AI response is empty. Try again or check your OpenRouter credits.');
                }
                
            } catch (error) {
                console.error('💥 COMPLETE ERROR:', error);
                document.getElementById('loader')?.remove();
                let errorMsg = '❌ Error: ' + error.message;
                
                // Specific error messages
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    errorMsg = '🔌 Connection Error: Backend FastAPI is not running!\n\nTo start the backend:\n1. Open a terminal in the project folder\n2. Run: cd backend && python api.py\n3. Wait for server to start on http://localhost:8000\n4. Reload this page';
                } else if (error.message.includes('402') || error.message.includes('requires more credits')) {
                    errorMsg = '💳 INSUFFICIENT CREDITS\n\n⚠️ Your OpenRouter account doesn\'t have enough credits for this request.\n\n🔗 Recharge your account here:\nhttps://openrouter.ai/credits\n\n💡 Tip: I reduced max_tokens to 400 to save your remaining credits. Recharge to fully enjoy the AI!';
                } else if (error.message.includes('401')) {
                    errorMsg = '🔑 Authentication Error: OpenRouter API key is invalid or expired.';
                } else if (error.message.includes('429')) {
                    errorMsg = '⏱️ Too Many Requests: Wait a few moments before trying again.';
                } else if (error.message.includes('404')) {
                    errorMsg = '❓ Endpoint Not Found: The /v1/chat/completions endpoint doesn\'t exist on the backend.';
                } else if (error.message.includes('500')) {
                    errorMsg = '⚙️ Server Error: Problem with the backend. Try again in a moment.';
                }
                
                console.error('🚨 Error message displayed:', errorMsg);
                addMessage('assistant', errorMsg);
            } finally {
                // ALWAYS reset isGenerating to false and reactivate input
                console.log('🔄 Cleanup: isGenerating = false');
                document.getElementById('loader')?.remove();
                isGenerating = false;
                updateSendButtons();
                console.log('✅ Interface reactivated');
            }
        }
        
        // Nouvelle conversation
        function newChat() {
            messages = [];
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chat').classList.remove('active');
            document.getElementById('landing').classList.remove('hidden');
            document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
            activeBubble = null;
            activePrompt = '';
        }
    </script>
</body>
</html>
