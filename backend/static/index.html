<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortix AI - Agent Intelligent</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body, #root { 
            height: 100%; 
            background: var(--bg-primary); 
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateX(-20px); } 
            to { opacity: 1; transform: translateX(0); } 
        }
        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.5; } 
        }
        @keyframes typing {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-pulse { animation: pulse 2s infinite; }
        .animate-typing { animation: typing 1.5s ease-in-out infinite; }
        .gradient-flow {
            background: linear-gradient(270deg, #6366f1, #8b5cf6, #a855f7, #6366f1);
            background-size: 400% 400%;
            animation: gradientFlow 8s ease infinite;
        }
        .shimmer {
            background: linear-gradient(90deg, #1a1a25 25%, #2a2a35 50%, #1a1a25 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .glass { 
            background: rgba(255,255,255,0.03); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .glass-hover:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        pre, code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
        }
        pre {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .markdown h1 { font-size: 1.5rem; font-weight: 600; margin: 16px 0 8px; }
        .markdown h2 { font-size: 1.25rem; font-weight: 600; margin: 14px 0 6px; }
        .markdown h3 { font-size: 1.1rem; font-weight: 500; margin: 12px 0 4px; }
        .markdown p { margin: 8px 0; line-height: 1.6; }
        .markdown ul, .markdown ol { margin: 8px 0; padding-left: 24px; }
        .markdown li { margin: 4px 0; }
        .markdown a { color: var(--accent); text-decoration: underline; }
        .markdown blockquote { 
            border-left: 3px solid var(--accent); 
            padding-left: 16px; 
            margin: 8px 0;
            color: var(--text-secondary);
        }

        .model-badge {
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(99,102,241,0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // ============================================================
        // CONFIGURATION
        // ============================================================
        const OPENROUTER_API_KEY = "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";
        const API_BASE = window.location.origin;

        // ============================================================
        // TASK ANALYSIS (Frontend mirror of backend logic)
        // ============================================================
        const TASK_KEYWORDS = {
            coding: ["code", "programming", "python", "javascript", "function", "debug", "api", "développer", "coder"],
            presentation: ["presentation", "slide", "slides", "powerpoint", "ppt", "diapositive", "diaporama"],
            writing: ["write", "article", "blog", "essay", "écrire", "rédiger", "texte"],
            analysis: ["analyze", "analyse", "data", "statistics", "rapport", "analyser"],
            creative: ["creative", "imagine", "story", "poem", "créatif", "inventer"],
            research: ["research", "find", "search", "chercher", "rechercher"],
            math: ["math", "calculate", "equation", "calculer", "formule"],
            translation: ["translate", "translation", "traduire", "traduction"],
            summarization: ["summarize", "summary", "résumer", "résumé"],
        };

        const MODEL_PREFERENCES = {
            coding: { model: "anthropic/claude-3.5-sonnet", name: "Claude 3.5 Sonnet", emoji: "💻" },
            presentation: { model: "openai/gpt-4-turbo", name: "GPT-4 Turbo", emoji: "📊" },
            writing: { model: "openai/gpt-4-turbo", name: "GPT-4 Turbo", emoji: "✍️" },
            analysis: { model: "anthropic/claude-3.5-sonnet", name: "Claude 3.5 Sonnet", emoji: "📈" },
            creative: { model: "openai/gpt-4-turbo", name: "GPT-4 Turbo", emoji: "🎨" },
            research: { model: "google/gemini-pro-1.5", name: "Gemini Pro 1.5", emoji: "🔍" },
            math: { model: "anthropic/claude-3.5-sonnet", name: "Claude 3.5 Sonnet", emoji: "🔢" },
            translation: { model: "openai/gpt-4o-mini", name: "GPT-4o Mini", emoji: "🌐" },
            summarization: { model: "openai/gpt-4o-mini", name: "GPT-4o Mini", emoji: "📝" },
            default: { model: "anthropic/claude-3.5-sonnet", name: "Claude 3.5 Sonnet", emoji: "🤖" }
        };

        const analyzeTask = (query) => {
            const queryLower = query.toLowerCase();
            let bestMatch = { type: "default", score: 0, keywords: [] };

            for (const [taskType, keywords] of Object.entries(TASK_KEYWORDS)) {
                const matched = keywords.filter(kw => queryLower.includes(kw));
                if (matched.length > bestMatch.score) {
                    bestMatch = { type: taskType, score: matched.length, keywords: matched };
                }
            }

            const modelInfo = MODEL_PREFERENCES[bestMatch.type] || MODEL_PREFERENCES.default;
            return {
                taskType: bestMatch.type,
                confidence: Math.min(bestMatch.score / 2, 1),
                keywords: bestMatch.keywords,
                ...modelInfo
            };
        };

        // ============================================================
        // SYSTEM PROMPTS BY TASK
        // ============================================================
        const SYSTEM_PROMPTS = {
            coding: `Tu es un expert en programmation. Tu fournis du code propre, commenté et fonctionnel.
Tu expliques ton code étape par étape et proposes des optimisations.`,
            
            presentation: `Tu es un expert en création de présentations professionnelles.
Pour chaque demande de slides, tu crées une présentation structurée avec:
- Un titre accrocheur pour chaque slide
- Des points clés sous forme de bullet points
- Des suggestions de visuels
- Des notes pour le présentateur

Format ta réponse slide par slide ainsi:
---
## 📊 Slide 1: [Titre]
**Points clés:**
• Point 1
• Point 2
• Point 3

**Note présentateur:** [Conseil]
**Visuel suggéré:** [Description]
---`,

            writing: `Tu es un rédacteur professionnel. Tu adaptes ton style au contexte.
Tu structures tes textes avec une introduction, un développement et une conclusion.`,

            analysis: `Tu es un analyste expert. Tu fournis des analyses structurées avec:
- Données clés et métriques
- Insights actionnables
- Recommandations concrètes`,

            creative: `Tu es un créatif talentueux. Tu proposes des idées originales et innovantes.
Tu explores plusieurs options et variantes.`,

            research: `Tu es un chercheur expert. Tu fournis des informations précises et sourcées.
Tu structures tes résultats par thème et distingues les faits des opinions.`,

            math: `Tu es un mathématicien expert. Tu montres chaque étape de calcul.
Tu expliques le raisonnement et vérifies les résultats.`,

            translation: `Tu es un traducteur professionnel. Tu fournis des traductions précises
et naturelles, en préservant le sens et le style du texte original.`,

            summarization: `Tu es expert en synthèse. Tu crées des résumés clairs et concis
qui capturent l'essentiel de l'information.`,

            default: `Tu es Kortix AI, un assistant IA ultra-intelligent et polyvalent.
Tu réponds de manière claire, structurée et professionnelle avec des emojis pertinents.`
        };

        // ============================================================
        // MODEL ANALYSIS BADGE
        // ============================================================
        const ModelAnalysisBadge = ({ analysis, isAnalyzing }) => {
            if (isAnalyzing) {
                return (
                    <div className="flex items-center gap-2 px-3 py-2 rounded-lg shimmer mb-4">
                        <div className="w-4 h-4 rounded-full bg-indigo-500/50 animate-pulse"></div>
                        <span className="text-sm text-white/50">Analyse de la tâche...</span>
                    </div>
                );
            }

            if (!analysis) return null;

            return (
                <div className="model-badge rounded-xl p-4 mb-4 animate-fade-in">
                    <div className="flex items-center gap-3 mb-2">
                        <span className="text-2xl">{analysis.emoji}</span>
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="font-medium text-white">{analysis.name}</span>
                                <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">
                                    {(analysis.confidence * 100).toFixed(0)}% confiance
                                </span>
                            </div>
                            <p className="text-xs text-white/50">
                                Tâche détectée: <span className="text-indigo-300">{analysis.taskType}</span>
                                {analysis.keywords.length > 0 && (
                                    <span> • Mots-clés: {analysis.keywords.join(", ")}</span>
                                )}
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // MESSAGE COMPONENT
        // ============================================================
        const Message = ({ message, analysis }) => {
            const isUser = message.role === 'user';
            
            const renderContent = (content) => {
                // Code blocks
                content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
                content = content.replace(/`([^`]+)`/g, '<code class="bg-white/10 px-1 rounded">$1</code>');
                content = content.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                content = content.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                content = content.replace(/^### (.+)$/gm, '<h3 class="text-lg font-semibold mt-4 mb-2">$1</h3>');
                content = content.replace(/^## (.+)$/gm, '<h2 class="text-xl font-semibold mt-4 mb-2">$1</h2>');
                content = content.replace(/^# (.+)$/gm, '<h1 class="text-2xl font-bold mt-4 mb-2">$1</h1>');
                content = content.replace(/^---$/gm, '<hr class="my-4 border-white/10">');
                content = content.replace(/^• (.+)$/gm, '<li class="ml-4">$1</li>');
                content = content.replace(/\n/g, '<br>');
                return content;
            };

            return (
                <div className={`flex gap-3 animate-fade-in ${isUser ? 'flex-row-reverse' : ''}`}>
                    <div className={`
                        flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center
                        ${isUser ? 'bg-indigo-500' : 'glass'}
                    `}>
                        {isUser ? '👤' : (analysis?.emoji || '🤖')}
                    </div>

                    <div className="max-w-[85%]">
                        {!isUser && message.showAnalysis && analysis && (
                            <div className="text-xs text-white/40 mb-1">
                                {analysis.name} • {analysis.taskType}
                            </div>
                        )}
                        <div className={`
                            rounded-2xl p-4
                            ${isUser 
                                ? 'bg-indigo-500/20 border border-indigo-500/30' 
                                : 'glass'
                            }
                        `}>
                            <div 
                                className="text-sm markdown whitespace-pre-wrap"
                                dangerouslySetInnerHTML={{ __html: renderContent(message.content) }}
                            />
                        </div>
                        {message.timestamp && (
                            <div className="text-xs text-white/30 mt-1 px-2">
                                {new Date(message.timestamp).toLocaleTimeString()}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================================
        // TYPING INDICATOR
        // ============================================================
        const TypingIndicator = ({ analysis }) => (
            <div className="flex gap-3 animate-fade-in">
                <div className="flex-shrink-0 w-8 h-8 rounded-full glass flex items-center justify-center">
                    {analysis?.emoji || '🤖'}
                </div>
                <div className="glass rounded-2xl p-4">
                    <div className="flex items-center gap-2">
                        <div className="flex gap-1">
                            <div className="w-2 h-2 rounded-full bg-white/50 animate-typing" style={{animationDelay: '0s'}}></div>
                            <div className="w-2 h-2 rounded-full bg-white/50 animate-typing" style={{animationDelay: '0.2s'}}></div>
                            <div className="w-2 h-2 rounded-full bg-white/50 animate-typing" style={{animationDelay: '0.4s'}}></div>
                        </div>
                        <span className="text-xs text-white/50">
                            {analysis?.name || 'AI'} génère...
                        </span>
                    </div>
                </div>
            </div>
        );

        // ============================================================
        // CHAT INPUT
        // ============================================================
        const ChatInput = ({ onSend, isLoading, currentAnalysis }) => {
            const [message, setMessage] = useState('');
            const [previewAnalysis, setPreviewAnalysis] = useState(null);
            const textareaRef = useRef(null);

            // Analyze message as user types (debounced)
            useEffect(() => {
                if (message.trim().length > 10) {
                    const timer = setTimeout(() => {
                        setPreviewAnalysis(analyzeTask(message));
                    }, 300);
                    return () => clearTimeout(timer);
                } else {
                    setPreviewAnalysis(null);
                }
            }, [message]);

            const handleSubmit = () => {
                if (message.trim() && !isLoading) {
                    onSend(message.trim());
                    setMessage('');
                    setPreviewAnalysis(null);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
            };

            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 200) + 'px';
                }
            }, [message]);

            return (
                <div className="p-4 border-t border-white/5">
                    <div className="max-w-4xl mx-auto">
                        {/* Preview analysis while typing */}
                        {previewAnalysis && !isLoading && (
                            <div className="flex items-center gap-2 mb-2 text-xs text-white/40 animate-fade-in">
                                <span>{previewAnalysis.emoji}</span>
                                <span>Modèle suggéré: <span className="text-indigo-300">{previewAnalysis.name}</span></span>
                                <span className="text-white/20">•</span>
                                <span>Tâche: {previewAnalysis.taskType}</span>
                            </div>
                        )}

                        <div className="glass rounded-2xl p-3 transition-all focus-within:border-indigo-500/50">
                            <div className="flex items-end gap-3">
                                <button className="flex-shrink-0 p-2 rounded-xl text-white/40 hover:text-white/70 hover:bg-white/5 transition-colors">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                                    </svg>
                                </button>

                                <textarea
                                    ref={textareaRef}
                                    value={message}
                                    onChange={(e) => setMessage(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    placeholder="Décris ta tâche... (ex: Crée une présentation sur l'IA)"
                                    disabled={isLoading}
                                    rows={1}
                                    className="flex-1 bg-transparent text-white placeholder-white/30 resize-none focus:outline-none min-h-[24px] max-h-[200px]"
                                    style={{ scrollbarWidth: 'none' }}
                                />

                                <button
                                    onClick={handleSubmit}
                                    disabled={!message.trim() || isLoading}
                                    className={`
                                        flex-shrink-0 p-2 rounded-xl transition-all
                                        ${message.trim() && !isLoading
                                            ? 'gradient-flow text-white hover:scale-105'
                                            : 'bg-white/5 text-white/30 cursor-not-allowed'
                                        }
                                    `}
                                >
                                    {isLoading ? (
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin">
                                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                        </svg>
                                    ) : (
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <line x1="22" y1="2" x2="11" y2="13"/>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                        </svg>
                                    )}
                                </button>
                            </div>
                        </div>
                        <p className="text-center text-xs text-white/30 mt-2">
                            🧠 L'IA analyse automatiquement ta tâche et choisit le meilleur modèle
                        </p>
                    </div>
                </div>
            );
        };

        // ============================================================
        // WELCOME SCREEN
        // ============================================================
        const WelcomeScreen = ({ onSend }) => {
            const suggestions = [
                { text: "📊 Crée une présentation de 5 slides sur l'intelligence artificielle", task: "presentation" },
                { text: "💻 Écris une fonction Python pour analyser un CSV", task: "coding" },
                { text: "📈 Analyse les tendances du marché tech en 2024", task: "analysis" },
                { text: "🌐 Traduis ce texte en 3 langues différentes", task: "translation" },
            ];

            return (
                <div className="flex-1 flex flex-col items-center justify-center p-8 animate-fade-in">
                    <div className="w-24 h-24 gradient-flow rounded-3xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/20">
                        <span className="text-5xl">🧠</span>
                    </div>

                    <h1 className="text-4xl font-bold mb-2 text-center bg-gradient-to-r from-white to-white/70 bg-clip-text text-transparent">
                        Kortix AI
                    </h1>
                    <p className="text-white/50 text-center mb-2 max-w-md">
                        Agent Intelligent avec sélection automatique du meilleur modèle IA
                    </p>
                    <p className="text-xs text-indigo-400 mb-8">
                        Claude 3.5 • GPT-4 Turbo • Gemini Pro • et plus...
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl w-full">
                        {suggestions.map((suggestion, index) => (
                            <button
                                key={index}
                                onClick={() => onSend(suggestion.text)}
                                className="glass glass-hover rounded-xl p-4 text-left transition-all hover:scale-[1.02] animate-slide-in group"
                                style={{ animationDelay: `${index * 0.1}s` }}
                            >
                                <p className="text-sm text-white/70 group-hover:text-white transition-colors">
                                    {suggestion.text}
                                </p>
                                <p className="text-xs text-white/30 mt-1">
                                    Modèle: {MODEL_PREFERENCES[suggestion.task]?.name}
                                </p>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // ============================================================
        // MAIN APP
        // ============================================================
        const App = () => {
            const [messages, setMessages] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [currentAnalysis, setCurrentAnalysis] = useState(null);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading]);

            const handleSend = async (content) => {
                if (!content.trim()) return;

                // Analyze task
                setIsAnalyzing(true);
                const analysis = analyzeTask(content);
                setCurrentAnalysis(analysis);
                
                await new Promise(r => setTimeout(r, 500)); // Brief delay to show analysis
                setIsAnalyzing(false);

                // Add user message
                const userMessage = {
                    id: Date.now().toString(),
                    role: 'user',
                    content,
                    timestamp: new Date().toISOString()
                };
                setMessages(prev => [...prev, userMessage]);
                setIsLoading(true);

                try {
                    // Get system prompt for task type
                    const systemPrompt = SYSTEM_PROMPTS[analysis.taskType] || SYSTEM_PROMPTS.default;

                    // Build messages array
                    const apiMessages = [
                        { role: "system", content: systemPrompt },
                        ...messages.map(m => ({ role: m.role, content: m.content })),
                        { role: "user", content }
                    ];

                    // Call OpenRouter with selected model
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                            'Content-Type': 'application/json',
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'Kortix AI Smart Agent'
                        },
                        body: JSON.stringify({
                            model: analysis.model,
                            messages: apiMessages,
                            stream: true,
                            temperature: 0.7,
                            max_tokens: 4096
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';
                    const assistantMessageId = (Date.now() + 1).toString();

                    // Add empty assistant message with analysis
                    setMessages(prev => [...prev, {
                        id: assistantMessageId,
                        role: 'assistant',
                        content: '',
                        timestamp: new Date().toISOString(),
                        showAnalysis: true,
                        analysis: analysis
                    }]);

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const json = JSON.parse(line.slice(6));
                                    const content = json.choices?.[0]?.delta?.content || '';
                                    if (content) {
                                        fullContent += content;
                                        setMessages(prev => prev.map(msg =>
                                            msg.id === assistantMessageId
                                                ? { ...msg, content: fullContent }
                                                : msg
                                        ));
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        role: 'assistant',
                        content: `❌ Erreur: ${error.message}. Veuillez réessayer.`,
                        timestamp: new Date().toISOString()
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="h-full flex flex-col">
                    {/* Header */}
                    <div className="flex items-center justify-between p-4 border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 gradient-flow rounded-xl flex items-center justify-center">
                                <span className="text-xl">🧠</span>
                            </div>
                            <div>
                                <h1 className="font-semibold">Kortix AI</h1>
                                <p className="text-xs text-white/50">Agent Intelligent Multi-Modèle</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {currentAnalysis && (
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 text-xs">
                                    <span>{currentAnalysis.emoji}</span>
                                    <span className="text-white/70">{currentAnalysis.name}</span>
                                </div>
                            )}
                            <button 
                                onClick={() => {
                                    setMessages([]);
                                    setCurrentAnalysis(null);
                                }}
                                className="p-2 rounded-xl glass glass-hover text-white/50 hover:text-white"
                                title="Nouvelle conversation"
                            >
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    {/* Messages */}
                    <div className="flex-1 overflow-y-auto">
                        {messages.length === 0 ? (
                            <WelcomeScreen onSend={handleSend} />
                        ) : (
                            <div className="max-w-4xl mx-auto p-4 space-y-4">
                                {isAnalyzing && <ModelAnalysisBadge isAnalyzing={true} />}
                                
                                {messages.map((message, index) => (
                                    <Message 
                                        key={message.id} 
                                        message={message}
                                        analysis={message.analysis || currentAnalysis}
                                    />
                                ))}
                                
                                {isLoading && messages[messages.length - 1]?.role === 'user' && (
                                    <TypingIndicator analysis={currentAnalysis} />
                                )}
                                
                                <div ref={messagesEndRef} />
                            </div>
                        )}
                    </div>

                    {/* Input */}
                    <ChatInput 
                        onSend={handleSend} 
                        isLoading={isLoading}
                        currentAnalysis={currentAnalysis}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
