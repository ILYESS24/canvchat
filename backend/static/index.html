<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortix AI - Agents Intelligents</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body, #root { 
            height: 100%; 
            background: var(--bg-primary); 
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Animations */
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateX(-20px); } 
            to { opacity: 1; transform: translateX(0); } 
        }
        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.5; } 
        }
        @keyframes typing {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-pulse { animation: pulse 2s infinite; }
        .animate-typing { animation: typing 1.5s ease-in-out infinite; }
        .gradient-flow {
            background: linear-gradient(270deg, #6366f1, #8b5cf6, #a855f7, #6366f1);
            background-size: 400% 400%;
            animation: gradientFlow 8s ease infinite;
        }

        /* Custom classes */
        .glass { 
            background: rgba(255,255,255,0.03); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .glass-hover:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        /* Code blocks */
        pre, code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
        }
        pre {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 8px 0;
        }

        /* Markdown styling */
        .markdown h1 { font-size: 1.5rem; font-weight: 600; margin: 16px 0 8px; }
        .markdown h2 { font-size: 1.25rem; font-weight: 600; margin: 14px 0 6px; }
        .markdown h3 { font-size: 1.1rem; font-weight: 500; margin: 12px 0 4px; }
        .markdown p { margin: 8px 0; line-height: 1.6; }
        .markdown ul, .markdown ol { margin: 8px 0; padding-left: 24px; }
        .markdown li { margin: 4px 0; }
        .markdown a { color: var(--accent); text-decoration: underline; }
        .markdown blockquote { 
            border-left: 3px solid var(--accent); 
            padding-left: 16px; 
            margin: 8px 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        // ============================================================
        // CONFIGURATION
        // ============================================================
        const OPENROUTER_API_KEY = "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";
        const API_BASE = window.location.origin;

        // ============================================================
        // AGENTS DATA
        // ============================================================
        const AGENTS = [
            {
                id: "super-worker",
                name: "Super Worker",
                description: "Agent généraliste avancé",
                avatar: "🚀",
                model: "anthropic/claude-3.5-sonnet",
                systemPrompt: `Tu es Kortix Super Worker, un assistant IA avancé et polyvalent. 
Tu peux aider avec:
- 🔍 Recherche web et analyse d'informations
- 💻 Développement et code
- 📊 Analyse de données
- ✍️ Rédaction de contenu
- 🎨 Design et créativité
- 🤖 Automatisation de tâches

Réponds de manière claire, structurée et engageante. Utilise des emojis pertinents.`
            },
            {
                id: "data-analyst",
                name: "Data Analyst",
                description: "Analyse de données",
                avatar: "🧠",
                model: "anthropic/claude-3.5-sonnet",
                systemPrompt: "Tu es un expert en analyse de données. Tu aides à comprendre les données, créer des visualisations et extraire des insights."
            },
            {
                id: "code-assistant",
                name: "Code Assistant",
                description: "Aide au développement",
                avatar: "💻",
                model: "anthropic/claude-3.5-sonnet",
                systemPrompt: "Tu es un expert en programmation. Tu aides à écrire du code, débugger et améliorer les performances."
            },
            {
                id: "content-writer",
                name: "Content Writer",
                description: "Création de contenu",
                avatar: "📝",
                model: "openai/gpt-4-turbo",
                systemPrompt: "Tu es un rédacteur créatif. Tu aides à créer du contenu engageant pour blogs, réseaux sociaux et marketing."
            }
        ];

        // ============================================================
        // ICONS COMPONENT
        // ============================================================
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // ============================================================
        // SIDEBAR COMPONENT
        // ============================================================
        const Sidebar = ({ agents, selectedAgent, onSelectAgent, isOpen, onToggle }) => {
            return (
                <div className={`
                    fixed md:relative z-40 h-full
                    ${isOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                    transition-transform duration-300 ease-in-out
                    w-72 bg-[#12121a] border-r border-white/5 flex flex-col
                `}>
                    {/* Header */}
                    <div className="p-4 border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 gradient-flow rounded-xl flex items-center justify-center">
                                <span className="text-xl">🚀</span>
                            </div>
                            <div>
                                <h1 className="font-semibold text-lg">Kortix AI</h1>
                                <p className="text-xs text-white/50">Agents Intelligents</p>
                            </div>
                        </div>
                    </div>

                    {/* Agents List */}
                    <div className="flex-1 overflow-y-auto p-3">
                        <p className="text-xs font-medium text-white/40 uppercase tracking-wider px-3 mb-2">
                            Agents Disponibles
                        </p>
                        <div className="space-y-1">
                            {agents.map((agent) => (
                                <button
                                    key={agent.id}
                                    onClick={() => onSelectAgent(agent)}
                                    className={`
                                        w-full p-3 rounded-xl text-left transition-all
                                        ${selectedAgent?.id === agent.id 
                                            ? 'bg-indigo-500/20 border border-indigo-500/30' 
                                            : 'glass glass-hover'
                                        }
                                    `}
                                >
                                    <div className="flex items-center gap-3">
                                        <span className="text-2xl">{agent.avatar}</span>
                                        <div className="flex-1 min-w-0">
                                            <p className="font-medium text-sm truncate">{agent.name}</p>
                                            <p className="text-xs text-white/50 truncate">{agent.description}</p>
                                        </div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="p-4 border-t border-white/5">
                        <div className="flex items-center gap-2 text-xs text-white/40">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <span>API Connectée</span>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // MESSAGE COMPONENT
        // ============================================================
        const Message = ({ message, agent }) => {
            const isUser = message.role === 'user';
            
            // Simple markdown-like rendering
            const renderContent = (content) => {
                // Code blocks
                content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
                // Inline code
                content = content.replace(/`([^`]+)`/g, '<code class="bg-white/10 px-1 rounded">$1</code>');
                // Bold
                content = content.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                // Italic
                content = content.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                // Line breaks
                content = content.replace(/\n/g, '<br>');
                
                return content;
            };

            return (
                <div className={`flex gap-3 animate-fade-in ${isUser ? 'flex-row-reverse' : ''}`}>
                    {/* Avatar */}
                    <div className={`
                        flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center
                        ${isUser ? 'bg-indigo-500' : 'glass'}
                    `}>
                        {isUser ? (
                            <span className="text-sm">👤</span>
                        ) : (
                            <span className="text-sm">{agent?.avatar || '🤖'}</span>
                        )}
                    </div>

                    {/* Message Content */}
                    <div className={`
                        max-w-[80%] rounded-2xl p-4
                        ${isUser 
                            ? 'bg-indigo-500/20 border border-indigo-500/30' 
                            : 'glass'
                        }
                    `}>
                        <div 
                            className="text-sm markdown whitespace-pre-wrap"
                            dangerouslySetInnerHTML={{ __html: renderContent(message.content) }}
                        />
                        {message.timestamp && (
                            <div className="text-xs text-white/30 mt-2">
                                {new Date(message.timestamp).toLocaleTimeString()}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================================
        // TYPING INDICATOR
        // ============================================================
        const TypingIndicator = ({ agent }) => (
            <div className="flex gap-3 animate-fade-in">
                <div className="flex-shrink-0 w-8 h-8 rounded-full glass flex items-center justify-center">
                    <span className="text-sm">{agent?.avatar || '🤖'}</span>
                </div>
                <div className="glass rounded-2xl p-4">
                    <div className="flex items-center gap-2">
                        <div className="flex gap-1">
                            <div className="w-2 h-2 rounded-full bg-white/50 animate-typing" style={{animationDelay: '0s'}}></div>
                            <div className="w-2 h-2 rounded-full bg-white/50 animate-typing" style={{animationDelay: '0.2s'}}></div>
                            <div className="w-2 h-2 rounded-full bg-white/50 animate-typing" style={{animationDelay: '0.4s'}}></div>
                        </div>
                        <span className="text-xs text-white/50">
                            {agent?.name || 'AI'} réfléchit...
                        </span>
                    </div>
                </div>
            </div>
        );

        // ============================================================
        // CHAT INPUT COMPONENT
        // ============================================================
        const ChatInput = ({ onSend, isLoading }) => {
            const [message, setMessage] = useState('');
            const textareaRef = useRef(null);

            const handleSubmit = () => {
                if (message.trim() && !isLoading) {
                    onSend(message.trim());
                    setMessage('');
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
            };

            // Auto-resize textarea
            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 200) + 'px';
                }
            }, [message]);

            return (
                <div className="p-4 border-t border-white/5">
                    <div className="max-w-4xl mx-auto">
                        <div className="glass rounded-2xl p-3 transition-all focus-within:border-indigo-500/50">
                            <div className="flex items-end gap-3">
                                {/* File Upload Button */}
                                <button className="flex-shrink-0 p-2 rounded-xl text-white/40 hover:text-white/70 hover:bg-white/5 transition-colors">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                                    </svg>
                                </button>

                                {/* Textarea */}
                                <textarea
                                    ref={textareaRef}
                                    value={message}
                                    onChange={(e) => setMessage(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    placeholder="Écrivez votre message..."
                                    disabled={isLoading}
                                    rows={1}
                                    className="flex-1 bg-transparent text-white placeholder-white/30 resize-none focus:outline-none min-h-[24px] max-h-[200px]"
                                    style={{ scrollbarWidth: 'none' }}
                                />

                                {/* Voice Button */}
                                <button className="flex-shrink-0 p-2 rounded-xl text-white/40 hover:text-white/70 hover:bg-white/5 transition-colors">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                        <line x1="12" y1="19" x2="12" y2="23"/>
                                        <line x1="8" y1="23" x2="16" y2="23"/>
                                    </svg>
                                </button>

                                {/* Send Button */}
                                <button
                                    onClick={handleSubmit}
                                    disabled={!message.trim() || isLoading}
                                    className={`
                                        flex-shrink-0 p-2 rounded-xl transition-all
                                        ${message.trim() && !isLoading
                                            ? 'bg-indigo-500 text-white hover:bg-indigo-600 hover:scale-105'
                                            : 'bg-white/5 text-white/30 cursor-not-allowed'
                                        }
                                    `}
                                >
                                    {isLoading ? (
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin">
                                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                        </svg>
                                    ) : (
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <line x1="22" y1="2" x2="11" y2="13"/>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                        </svg>
                                    )}
                                </button>
                            </div>
                        </div>
                        <p className="text-center text-xs text-white/30 mt-2">
                            Entrée pour envoyer · Shift+Entrée pour nouvelle ligne
                        </p>
                    </div>
                </div>
            );
        };

        // ============================================================
        // WELCOME SCREEN
        // ============================================================
        const WelcomeScreen = ({ agent, onSend }) => {
            const suggestions = [
                "Explique-moi comment fonctionne l'IA générative",
                "Aide-moi à écrire du code Python pour analyser des données",
                "Rédige un article de blog sur la productivité",
                "Quelles sont les tendances tech en 2026 ?"
            ];

            return (
                <div className="flex-1 flex flex-col items-center justify-center p-8 animate-fade-in">
                    {/* Agent Avatar */}
                    <div className="w-20 h-20 gradient-flow rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/20">
                        <span className="text-4xl">{agent?.avatar || '🚀'}</span>
                    </div>

                    {/* Title */}
                    <h1 className="text-3xl font-semibold mb-2 text-center">
                        {agent?.name || 'Kortix AI'}
                    </h1>
                    <p className="text-white/50 text-center mb-8 max-w-md">
                        {agent?.description || 'Comment puis-je vous aider aujourd\'hui ?'}
                    </p>

                    {/* Suggestions */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl w-full">
                        {suggestions.map((suggestion, index) => (
                            <button
                                key={index}
                                onClick={() => onSend(suggestion)}
                                className="glass glass-hover rounded-xl p-4 text-left transition-all hover:scale-[1.02] animate-slide-in"
                                style={{ animationDelay: `${index * 0.1}s` }}
                            >
                                <p className="text-sm text-white/70">{suggestion}</p>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // ============================================================
        // MAIN APP COMPONENT
        // ============================================================
        const App = () => {
            const [selectedAgent, setSelectedAgent] = useState(AGENTS[0]);
            const [messages, setMessages] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const messagesEndRef = useRef(null);

            // Scroll to bottom on new messages
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading]);

            // Handle sending message
            const handleSend = async (content) => {
                if (!content.trim()) return;

                // Add user message
                const userMessage = {
                    id: Date.now().toString(),
                    role: 'user',
                    content,
                    timestamp: new Date().toISOString()
                };
                setMessages(prev => [...prev, userMessage]);
                setIsLoading(true);

                try {
                    // Call OpenRouter API
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                            'Content-Type': 'application/json',
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'Kortix AI'
                        },
                        body: JSON.stringify({
                            model: selectedAgent.model,
                            messages: [
                                { role: 'system', content: selectedAgent.systemPrompt },
                                ...messages.map(m => ({ role: m.role, content: m.content })),
                                { role: 'user', content }
                            ],
                            stream: true,
                            temperature: 0.7,
                            max_tokens: 4000
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    // Process streaming response
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';
                    const assistantMessageId = (Date.now() + 1).toString();

                    // Add empty assistant message
                    setMessages(prev => [...prev, {
                        id: assistantMessageId,
                        role: 'assistant',
                        content: '',
                        timestamp: new Date().toISOString()
                    }]);

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const json = JSON.parse(line.slice(6));
                                    const content = json.choices?.[0]?.delta?.content || '';
                                    if (content) {
                                        fullContent += content;
                                        // Update the assistant message
                                        setMessages(prev => prev.map(msg =>
                                            msg.id === assistantMessageId
                                                ? { ...msg, content: fullContent }
                                                : msg
                                        ));
                                    }
                                } catch (e) {
                                    // Skip invalid JSON
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        role: 'assistant',
                        content: `❌ Désolé, une erreur s'est produite: ${error.message}. Veuillez réessayer.`,
                        timestamp: new Date().toISOString()
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            // Handle agent selection
            const handleSelectAgent = (agent) => {
                setSelectedAgent(agent);
                setMessages([]);
                setSidebarOpen(false);
            };

            return (
                <div className="h-full flex">
                    {/* Mobile Overlay */}
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 z-30 md:hidden"
                            onClick={() => setSidebarOpen(false)}
                        />
                    )}

                    {/* Sidebar */}
                    <Sidebar
                        agents={AGENTS}
                        selectedAgent={selectedAgent}
                        onSelectAgent={handleSelectAgent}
                        isOpen={sidebarOpen}
                        onToggle={() => setSidebarOpen(!sidebarOpen)}
                    />

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Header */}
                        <div className="flex items-center gap-4 p-4 border-b border-white/5">
                            {/* Mobile Menu Button */}
                            <button
                                onClick={() => setSidebarOpen(true)}
                                className="md:hidden p-2 rounded-xl glass glass-hover"
                            >
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <line x1="3" y1="12" x2="21" y2="12"/>
                                    <line x1="3" y1="6" x2="21" y2="6"/>
                                    <line x1="3" y1="18" x2="21" y2="18"/>
                                </svg>
                            </button>

                            {/* Current Agent */}
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">{selectedAgent.avatar}</span>
                                <div>
                                    <h2 className="font-medium">{selectedAgent.name}</h2>
                                    <p className="text-xs text-white/50">{selectedAgent.description}</p>
                                </div>
                            </div>

                            {/* Actions */}
                            <div className="flex-1"></div>
                            <button 
                                onClick={() => setMessages([])}
                                className="p-2 rounded-xl glass glass-hover text-white/50 hover:text-white"
                                title="Nouvelle conversation"
                            >
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                            </button>
                        </div>

                        {/* Messages Area */}
                        <div className="flex-1 overflow-y-auto">
                            {messages.length === 0 ? (
                                <WelcomeScreen agent={selectedAgent} onSend={handleSend} />
                            ) : (
                                <div className="max-w-4xl mx-auto p-4 space-y-4">
                                    {messages.map((message) => (
                                        <Message 
                                            key={message.id} 
                                            message={message} 
                                            agent={selectedAgent}
                                        />
                                    ))}
                                    {isLoading && messages[messages.length - 1]?.role === 'user' && (
                                        <TypingIndicator agent={selectedAgent} />
                                    )}
                                    <div ref={messagesEndRef} />
                                </div>
                            )}
                        </div>

                        {/* Input Area */}
                        <ChatInput onSend={handleSend} isLoading={isLoading} />
                    </div>
                </div>
            );
        };

        // Mount App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
