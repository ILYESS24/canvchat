        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --background: #000000;
            --foreground: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        textarea::-webkit-scrollbar { display: none; }
        textarea { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-blink { animation: blink 1s step-end infinite; }
        .animate-slide-down { animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
        .animate-message-in { animation: messageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-bubble-in { animation: bubbleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .bubble-hover:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 40px -10px rgba(255,255,255,0.15);
        }
        .bubble-hover:active {
            transform: scale(0.98);
        }

        /* Bubble task styles */
        .task-bubble {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            border-radius: 9999px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease-out;
            cursor: pointer;
            border: 1px solid;
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Gradient backgrounds for each bubble type */
        .bubble-slides {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(245, 158, 11, 0.2));
            border-color: rgba(249, 115, 22, 0.3);
        }
        .bubble-code {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
            border-color: rgba(59, 130, 246, 0.3);
        }
        .bubble-analyse {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(16, 185, 129, 0.2));
            border-color: rgba(34, 197, 94, 0.3);
        }
        .bubble-redaction {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(139, 92, 246, 0.2));
            border-color: rgba(168, 85, 247, 0.3);
        }
        .bubble-creative {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(244, 63, 94, 0.2));
            border-color: rgba(236, 72, 153, 0.3);
        }
        .bubble-traduction {
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(6, 182, 212, 0.2));
            border-color: rgba(20, 184, 166, 0.3);
        }
        .bubble-resume {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.2));
            border-color: rgba(99, 102, 241, 0.3);
        }
        .bubble-math {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.2), rgba(249, 115, 22, 0.2));
            border-color: rgba(234, 179, 8, 0.3);
        }
        .bubble-research {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(59, 130, 246, 0.2));
            border-color: rgba(14, 165, 233, 0.3);
        }
        .bubble-expert {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(168, 85, 247, 0.2));
            border-color: rgba(139, 92, 246, 0.3);
        }
        .bubble-debug {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(249, 115, 22, 0.2));
            border-color: rgba(239, 68, 68, 0.3);
        }
        .bubble-explain {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(234, 179, 8, 0.2));
            border-color: rgba(245, 158, 11, 0.3);
        }

        .task-bubble.active {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .task-bubble span:first-child {
            font-size: 1.125rem;
        }

        .task-bubble span:last-child {
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>

        // ========================================
        // INTELLIGENT MODEL SELECTION
        // ========================================
        const selectBestModel = (query) => {
            const q = query.toLowerCase();
            
            // 📊 Presentations - GPT-4 Turbo (creative + structured)
            if (q.includes("presentation") || q.includes("slide") || q.includes("ppt") || q.includes("diapo") || q.includes("powerpoint")) {
                return { model: AI_MODELS["gpt4-turbo"].id, name: AI_MODELS["gpt4-turbo"].name, emoji: "📊" };
            }
            
            // 💻 Coding - DeepSeek Coder (specialized)
            if (q.includes("code") || q.includes("programming") || q.includes("debug") || q.includes("function") || q.includes("python") || q.includes("javascript") || q.includes("bug") || q.includes("script") || q.includes("api")) {
                return { model: AI_MODELS["deepseek-coder"].id, name: AI_MODELS["deepseek-coder"].name, emoji: "💻" };
            }
            
            // 🧠 Complex reasoning - Claude 3 Opus (most intelligent)
            if (q.includes("explain") || q.includes("why") || q.includes("complex") || q.includes("philosophy") || q.includes("reason") || q.includes("logic") || q.includes("analyse en profondeur")) {
                return { model: AI_MODELS["claude-opus"].id, name: AI_MODELS["claude-opus"].name, emoji: "🧠" };
            }
            
            // ✍️ Writing - GPT-4o (natural language)
            if (q.includes("write") || q.includes("story") || q.includes("creative") || q.includes("écris") || q.includes("rédige") || q.includes("article") || q.includes("blog")) {
                return { model: AI_MODELS["gpt4o"].id, name: AI_MODELS["gpt4o"].name, emoji: "✍️" };
            }
            // 🔢 Math - Claude 3.5 Sonnet (precise calculations)
            if (q.includes("math") || q.includes("calculate") || q.includes("equation") || q.includes("calcul") || q.includes("formule") || q.includes("algèbre")) {
                return { model: AI_MODELS["claude-sonnet"].id, name: AI_MODELS["claude-sonnet"].name, emoji: "🔢" };
            }
            
            // 📈 Analysis - Claude 3.5 Sonnet (structured analysis)
            if (q.includes("analyze") || q.includes("analyse") || q.includes("data") || q.includes("statistics") || q.includes("rapport") || q.includes("insight")) {
                return { model: AI_MODELS["claude-sonnet"].id, name: AI_MODELS["claude-sonnet"].name, emoji: "📈" };
            }
            
            // 🔍 Research - Gemini Pro 1.5 (1M context)
            if (q.includes("research") || q.includes("recherche") || q.includes("find") || q.includes("discover") || q.includes("explore") || q.includes("investigate")) {
                return { model: AI_MODELS["gemini-pro"].id, name: AI_MODELS["gemini-pro"].name, emoji: "🔍" };
            }
            
            // 🌐 Translation - GPT-4o Mini (fast & accurate)
            if (q.includes("translate") || q.includes("traduis") || q.includes("traduction") || q.includes("language") || q.includes("french") || q.includes("english") || q.includes("spanish")) {
                return { model: AI_MODELS["gpt4o-mini"].id, name: AI_MODELS["gpt4o-mini"].name, emoji: "🌐" };
            }
            
            // 📝 Summary - Gemini Flash (fast processing)
            if (q.includes("summarize") || q.includes("résume") || q.includes("summary") || q.includes("tldr") || q.includes("synthèse")) {
                return { model: AI_MODELS["gemini-flash"].id, name: AI_MODELS["gemini-flash"].name, emoji: "📝" };
            }
            
            // 🦙 Long documents - Gemini Pro (1M context) or Llama 405B
            if (q.length > 2000) {
                return { model: AI_MODELS["gemini-pro"].id, name: AI_MODELS["gemini-pro"].name, emoji: "💎" };
            }
            
            // ⚡ Short/simple queries - Fast models
            if (q.length < 50) {
                return { model: AI_MODELS["claude-haiku"].id, name: AI_MODELS["claude-haiku"].name, emoji: "⚡" };
            }
            
            // 🌟 Default - GPT-4o (best all-around)
            return { model: AI_MODELS["gpt4o"].id, name: AI_MODELS["gpt4o"].name, emoji: "🌟" };
        };

        function LandingPage() {
            const [message, setMessage] = useState("");
            const [files, setFiles] = useState([]);
            const [isRecording, setIsRecording] = useState(false);
            const [phase, setPhase] = useState("landing");
            const [messages, setMessages] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [streamedContent, setStreamedContent] = useState("");
            const [selectedModel, setSelectedModel] = useState(null);
            const [activeTaskBubble, setActiveTaskBubble] = useState(null);

            const fileInputRef = useRef(null);
            const textareaRef = useRef(null);
            const chatContainerRef = useRef(null);

            useEffect(() => {
                if (chatContainerRef.current) {
                    chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
                }
            }, [messages, streamedContent]);

            // Focus textarea when bubble is selected
            useEffect(() => {
                if (activeTaskBubble && textareaRef.current) {
                    textareaRef.current.focus();
                }
            }, [activeTaskBubble]);

            const callOpenRouter = async (userMessage, forceModel = null) => {
                const modelInfo = forceModel || selectBestModel(userMessage);
                setSelectedModel(modelInfo);

                // Build system prompt based on task type
                let systemPrompt = "Tu es un assistant IA avancé et polyvalent. Tu réponds de manière claire, structurée et utile. Tu utilises des emojis pour rendre tes réponses plus engageantes.";
                
                if (activeTaskBubble) {
                    const taskPrompts = {
                        slides: `Tu es un expert en création de présentations professionnelles. 
Crée des slides structurées avec:
- Un titre accrocheur pour chaque slide
- 3-5 points clés par slide
- Des suggestions de visuels
- Des notes pour le présentateur

Format chaque slide ainsi:
---
## 📊 Slide X: [Titre]
**Points clés:**
• Point 1
• Point 2
• Point 3

**Visuel suggéré:** [Description]
**Note présentateur:** [Conseil]
---`,
                        code: `Tu es un développeur senior expert. Fournis du code:
- Propre et bien structuré
- Avec des commentaires explicatifs
- Suivant les meilleures pratiques
- Avec des exemples d'utilisation`,
                        analyse: `Tu es un analyste expert. Fournis des analyses:
- Structurées avec des sections claires
- Avec des données et métriques
- Avec des insights actionnables
- Avec des recommandations concrètes`,
                        redaction: `Tu es un rédacteur professionnel. Rédige des textes:
- Avec une structure claire (intro, développement, conclusion)
- Un ton adapté au contexte
- Des transitions fluides
- Un style engageant`,
                        creative: `Tu es un directeur créatif talentueux. Propose:
- Des idées originales et innovantes
- Plusieurs options/variantes
- Des concepts développés
- Des suggestions d'implémentation`,
                        traduction: `Tu es un traducteur professionnel polyglotte. Fournis:
- Des traductions précises et naturelles
- Le texte dans chaque langue demandée
- Des notes sur les nuances culturelles si pertinent`,
                        resume: `Tu es expert en synthèse. Crée des résumés:
- Clairs et concis
- Avec les points essentiels
- Structurés par thème
- Avec une conclusion`,
                        math: `Tu es un mathématicien expert. Résous les problèmes:
- Étape par étape
- Avec des explications claires
- En vérifiant les résultats
- Avec des méthodes alternatives si utile`
                    };
                    
                    if (taskPrompts[activeTaskBubble.id]) {
                        systemPrompt = taskPrompts[activeTaskBubble.id];
                    }
                }

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer 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",
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.origin,
                            "X-Title": "Kortix AI"
                        },
                        body: JSON.stringify({
                            model: forceModel?.id || modelInfo.model,
                            messages: [
                                { role: "system", content: systemPrompt },
                                ...messages.map(m => ({ role: m.role, content: m.content })),
                                { role: "user", content: userMessage }
                            ],
                            stream: true,
                            temperature: 0.7,
                            max_tokens: 4000
                        })
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    const reader = response.body?.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = "";

                    if (reader) {
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split("\n");

                            for (const line of lines) {
                                if (line.startsWith("data: ") && line !== "data: [DONE]") {
                                    try {
                                        const json = JSON.parse(line.slice(6));
                                        const content = json.choices?.[0]?.delta?.content || "";
                                        if (content) {
                                            fullContent += content;
                                            setStreamedContent(fullContent);
                                        }
                                    } catch (e) {}
                                }
                            }
                        }
                    }

                    return fullContent;
                } catch (error) {
                    console.error("OpenRouter Error:", error);
                    return "Désolé, une erreur s'est produite. Veuillez réessayer.";
                }
            };

            const handleSubmit = async () => {
                if (!message.trim() && files.length === 0) return;

                let userMessage = message.trim();
                
                // If a bubble is active, prepend the prompt
                if (activeTaskBubble && userMessage) {
                    userMessage = activeTaskBubble.prompt + userMessage;
                }
                
                setMessage("");

                const userMsg = {
                    id: Date.now().toString(),
                    role: "user",
                    content: userMessage
                };

                if (phase === "landing") {
                    setPhase("chat");
                }

                setMessages(prev => [...prev, userMsg]);
                setIsGenerating(true);
                setStreamedContent("");

                // Use the bubble's model if active
                const forceModel = activeTaskBubble ? {
                    id: activeTaskBubble.model.id,
                    model: activeTaskBubble.model.id,
                    name: activeTaskBubble.model.name,
                    emoji: activeTaskBubble.model.emoji || activeTaskBubble.emoji
                } : null;

                const response = await callOpenRouter(userMessage, forceModel);

                const assistantMsg = {
                    id: (Date.now() + 1).toString(),
                    role: "assistant",
                    content: response
                };

                setMessages(prev => [...prev, assistantMsg]);
                setIsGenerating(false);
                setStreamedContent("");
                setActiveTaskBubble(null);
            };

            const handleBubbleClick = (bubble) => {
                setActiveTaskBubble(bubble);
                setMessage("");
            };

            const handleKeyDown = (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
                if (e.key === "Escape" && activeTaskBubble) {
                    setActiveTaskBubble(null);
                    setMessage("");
                }
            };

            const handleFileSelect = (e) => {
                if (e.target.files) {
                    setFiles(prev => [...prev, ...Array.from(e.target.files)]);
                }
            };

            const removeFile = (index) => {
                setFiles(prev => prev.filter((_, i) => i !== index));
            };

            const getFileIcon = (file) => {
                if (file.type.startsWith("image/")) {
                    return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/70"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
                }
                return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/70"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
            };

            const toggleRecording = () => {
                setIsRecording(!isRecording);
            };

            // ========================================
            // INTERFACE LANDING (PAGE D'ACCUEIL)
            // ========================================
            if (phase === "landing") {
                return (
                    <div className="relative min-h-screen w-full overflow-hidden">
                        {/* Background Art - Van Gogh Starry Night */}
                        <div 
                            className="absolute inset-0 bg-cover bg-center bg-no-repeat"
                            style={{
                                backgroundImage: `url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg')`,
                            }}
                        >
                            <div className="absolute inset-0 bg-black/70" />
                        </div>

                        {/* Content */}
                        <div className="relative z-10 flex flex-col items-center justify-center min-h-screen px-4">
                            {/* Title */}
                            <div className="mb-12 animate-slide-down">
                                <h1 
                                    className="text-6xl md:text-8xl font-serif italic text-white/90 tracking-wide text-center drop-shadow-2xl"
                                    style={{ fontFamily: "'Playfair Display', Georgia, serif" }}
                                >
                                    Ignite curiosity
                                </h1>
                            </div>

                            {/* Prompt Area */}
                            <div className="w-full max-w-4xl animate-slide-up">
                                {/* Active Bubble Indicator */}
                                {activeTaskBubble && (
                                    <div className="flex items-center gap-2 mb-3 px-2 animate-fade-in">
                                        <span className="text-lg">{activeTaskBubble.emoji}</span>
                                        <span className="text-sm text-white/70">{activeTaskBubble.description}</span>
                                        <span className="text-xs text-white/40">avec {activeTaskBubble.model.name}</span>
                                        <button 
                                            onClick={() => { setActiveTaskBubble(null); setMessage(""); }}
                                            className="ml-auto p-1 rounded-full hover:bg-white/10"
                                        >
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/50"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                        </button>
                                    </div>
                                )}

                                {/* Files Preview */}
                                {files.length > 0 && (
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {files.map((file, index) => (
                                            <div
                                                key={index}
                                                className="group flex items-center gap-2 px-3 py-2 bg-white/5 backdrop-blur-xl rounded-2xl hover:bg-white/10 transition-all"
                                            >
                                                {getFileIcon(file)}
                                                <span className="text-xs text-white/80 max-w-[120px] truncate">{file.name}</span>
                                                <button
                                                    onClick={() => removeFile(index)}
                                                    className="p-0.5 hover:bg-white/20 rounded-full transition-colors opacity-0 group-hover:opacity-100"
                                                >
                                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/70"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Input Container */}
                                <div className="relative group">
                                    <div className="absolute -inset-0.5 bg-gradient-to-r from-white/10 via-white/5 to-white/10 rounded-[32px] blur opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-500" />

                                    <div className={`relative bg-white/5 backdrop-blur-xl rounded-[32px] overflow-hidden transition-all duration-300 hover:bg-white/8 focus-within:bg-white/10 ${activeTaskBubble ? activeTaskBubble.border + ' border' : ''}`}>
                                        <div className="flex items-center gap-3 px-5 py-4">
                                            <button
                                                onClick={() => fileInputRef.current?.click()}
                                                className="flex-shrink-0 p-2 rounded-2xl bg-white/5 hover:bg-white/10 transition-all"
                                            >
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/70"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                            </button>

                                            <textarea
                                                ref={textareaRef}
                                                value={message}
                                                onChange={(e) => setMessage(e.target.value)}
                                                onKeyDown={handleKeyDown}
                                                placeholder={activeTaskBubble ? activeTaskBubble.placeholder : "How can I help you today?"}
                                                rows={1}
                                                className="flex-1 bg-transparent text-white text-base placeholder-white/40 resize-none focus:outline-none min-h-[28px] max-h-[200px] py-1"
                                                style={{ scrollbarWidth: 'none' }}
                                            />

                                            <button
                                                onClick={toggleRecording}
                                                className={`flex-shrink-0 p-2 rounded-2xl transition-all ${
                                                    isRecording
                                                        ? "bg-red-500/20 text-red-400"
                                                        : "bg-white/5 text-white/70 hover:bg-white/10"
                                                }`}
                                            >
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                                            </button>

                                            <button
                                                onClick={handleSubmit}
                                                disabled={!message.trim() && files.length === 0}
                                                className={`flex-shrink-0 p-2 rounded-2xl transition-all ${
                                                    message.trim() || files.length > 0
                                                        ? "bg-white/90 text-black hover:bg-white hover:scale-105"
                                                        : "bg-white/5 text-white/30 cursor-not-allowed"
                                                }`}
                                            >
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    multiple
                                    onChange={handleFileSelect}
                                    className="hidden"
                                    accept="image/*,.pdf,.doc,.docx,.txt,.md,.csv,.json"
                                />

                                {/* Task Bubbles */}
                                <div className="mt-6">
                                    <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '0.75rem' }}>
                                        {TASK_BUBBLES.map((bubble, index) => (
                                            <button
                                                key={bubble.id}
                                                onClick={() => handleBubbleClick(bubble)}
                                                className={`task-bubble bubble-${bubble.id} bubble-hover animate-bubble-in ${activeTaskBubble?.id === bubble.id ? 'active' : ''}`}
                                                style={{ 
                                                    animationDelay: `${0.3 + index * 0.05}s`, 
                                                    opacity: 0 
                                                }}
                                            >
                                                <span>{bubble.emoji}</span>
                                                <span>{bubble.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <p className="text-center text-white/30 text-xs mt-4">
                                    {activeTaskBubble 
                                        ? `${activeTaskBubble.emoji} ${activeTaskBubble.description} • Échap pour annuler`
                                        : "Clique sur une bulle ou écris directement • Enter pour envoyer"
                                    }
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========================================
            // INTERFACE CHAT
            // ========================================
            return (
                <div className="relative min-h-screen w-full overflow-hidden">
                    {/* Background Art - Van Gogh Starry Night */}
                    <div 
                        className="absolute inset-0 bg-cover bg-center bg-no-repeat"
                        style={{
                            backgroundImage: `url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg')`,
                        }}
                    >
                        <div className="absolute inset-0 bg-black/70" />
                    </div>

                    {/* Content */}
                    <div className="relative z-10 flex flex-col h-screen">
                        {/* Header */}
                        <div className="flex items-center justify-between px-4 py-3 border-b border-white/5">
                            <div className="flex items-center gap-3">
                                <span className="text-xl">🎨</span>
                                <span className="font-medium text-white/90">Kortix AI</span>
                            </div>
                            <button
                                onClick={() => {
                                    setPhase("landing");
                                    setMessages([]);
                                    setActiveTaskBubble(null);
                                }}
                                className="p-2 rounded-xl bg-white/5 hover:bg-white/10 transition-all"
                                title="Nouvelle conversation"
                            >
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/70"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>

                        {/* Chat Messages */}
                        <div
                            ref={chatContainerRef}
                            className="flex-1 overflow-y-auto px-4 py-6 scrollbar-hide"
                            style={{ scrollBehavior: 'smooth' }}
                        >
                            <div className="max-w-4xl mx-auto space-y-6">
                                {messages.map((msg, index) => (
                                    <div
                                        key={msg.id}
                                        className="animate-message-in"
                                        style={{ animationDelay: `${index * 0.1}s` }}
                                    >
                                        {msg.role === "user" ? (
                                            <div className="flex justify-end">
                                                <div className="max-w-[85%] bg-white/5 backdrop-blur-xl rounded-2xl px-4 py-3">
                                                    <p className="text-sm text-white/90 leading-relaxed whitespace-pre-wrap">{msg.content}</p>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col gap-3">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-6 h-6 rounded-full bg-white/5 backdrop-blur-xl flex items-center justify-center">
                                                        <span>{selectedModel?.emoji || "🤖"}</span>
                                                    </div>
                                                    <span className="text-xs text-white/50 font-medium">
                                                        {selectedModel?.name || "ai"}
                                                    </span>
                                                </div>
                                                <div className="bg-white/5 backdrop-blur-xl rounded-2xl px-4 py-3 max-w-[85%]">
                                                    <div className="text-sm text-white/90 leading-relaxed whitespace-pre-wrap">
                                                        {msg.content}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {/* Streaming Response */}
                                {isGenerating && streamedContent && (
                                    <div className="animate-message-in">
                                        <div className="flex flex-col gap-3">
                                            <div className="flex items-center gap-2">
                                                <div className="w-6 h-6 rounded-full bg-white/5 backdrop-blur-xl flex items-center justify-center animate-pulse">
                                                    <span>{selectedModel?.emoji || "🤖"}</span>
                                                </div>
                                                <span className="text-xs text-white/50 font-medium">
                                                    {selectedModel?.name || "ai"} • generating...
                                                </span>
                                            </div>
                                            <div className="bg-white/5 backdrop-blur-xl rounded-2xl px-4 py-3 max-w-[85%]">
                                                <div className="text-sm text-white/90 leading-relaxed whitespace-pre-wrap">
                                                    {streamedContent}
                                                    <span className="inline-block w-1.5 h-4 bg-white/60 animate-blink ml-1" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Loading */}
                                {isGenerating && !streamedContent && (
                                    <div className="flex items-center gap-3 animate-fade-in">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/40 animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                        <span className="text-sm text-white/50">
                                            {selectedModel?.emoji} {selectedModel?.name || "AI"} génère...
                                        </span>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Quick Bubbles in Chat */}
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '0.5rem', padding: '0.5rem 1rem', overflowX: 'auto' }} className="scrollbar-hide">
                            {TASK_BUBBLES.slice(0, 4).map((bubble) => (
                                <button
                                    key={bubble.id}
                                    onClick={() => handleBubbleClick(bubble)}
                                    disabled={isGenerating}
                                    className={`task-bubble bubble-${bubble.id} ${activeTaskBubble?.id === bubble.id ? 'active' : ''}`}
                                    style={{ 
                                        fontSize: '0.75rem',
                                        padding: '0.375rem 0.75rem',
                                        opacity: isGenerating ? 0.5 : 1,
                                        cursor: isGenerating ? 'not-allowed' : 'pointer'
                                    }}
                                >
                                    <span>{bubble.emoji}</span>
                                    <span>{bubble.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* Input Area */}
                        <div className="flex-shrink-0 p-4">
                            <div className="max-w-4xl mx-auto">
                                {/* Active Bubble Indicator */}
                                {activeTaskBubble && (
                                    <div className="flex items-center gap-2 mb-2 px-2 animate-fade-in">
                                        <span>{activeTaskBubble.emoji}</span>
                                        <span className="text-xs text-white/60">{activeTaskBubble.description}</span>
                                        <button 
                                            onClick={() => { setActiveTaskBubble(null); setMessage(""); }}
                                            className="ml-auto p-1 rounded-full hover:bg-white/10"
                                        >
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-white/50"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                        </button>
                                    </div>
                                )}

                                <div className={`bg-white/5 backdrop-blur-xl rounded-2xl p-2 ${activeTaskBubble ? activeTaskBubble.border + ' border' : ''}`}>
                                    <div className="flex flex-col gap-2">
                                        <textarea
                                            ref={textareaRef}
                                            value={message}
                                            onChange={(e) => setMessage(e.target.value)}
                                            onKeyDown={handleKeyDown}
                                            placeholder={activeTaskBubble ? activeTaskBubble.placeholder : "Décris ce dont tu as besoin d'aide..."}
                                            rows={2}
                                            disabled={isGenerating}
                                            className="w-full bg-transparent text-white text-sm placeholder-white/40 resize-none focus:outline-none px-3 py-3 min-h-[72px] max-h-[200px]"
                                            style={{ scrollbarWidth: 'none' }}
                                        />

                                        <div className="flex items-center justify-between px-2 pb-1">
                                            <div className="flex items-center gap-2">
                                                <button
                                                    onClick={() => fileInputRef.current?.click()}
                                                    className="p-2 rounded-2xl bg-white/5 text-white/70 hover:bg-white/10 transition-all"
                                                >
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                                </button>
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <button
                                                    onClick={toggleRecording}
                                                    className={`p-2 rounded-2xl transition-all ${
                                                        isRecording
                                                            ? "bg-red-500/20 text-red-400"
                                                            : "bg-white/5 text-white/70 hover:bg-white/10"
                                                    }`}
                                                >
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                                                </button>

                                                <button
                                                    onClick={handleSubmit}
                                                    disabled={isGenerating || (!message.trim() && files.length === 0)}
                                                    className={`p-2 rounded-2xl transition-all ${
                                                        message.trim() && !isGenerating
                                                            ? "bg-white/90 text-black hover:bg-white hover:scale-105"
                                                            : "bg-white/5 text-white/30 cursor-not-allowed"
                                                    }`}
                                                >
                                                    {isGenerating ? (
                                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                                    ) : (
                                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Hidden File Input */}
                        <input
                            ref={fileInputRef}
                            type="file"
                            multiple
                            onChange={handleFileSelect}
                            className="hidden"
                            accept="image/*,.pdf,.doc,.docx,.txt,.md,.csv,.json"
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<LandingPage />, document.getElementById('root'));
    </script>
</body>
</html>
