services:
  # BACKEND - API FastAPI avec Frontend Next.js intégré
  - type: web
    name: kortix-backend
    env: python
    rootDir: ./
    buildCommand: |
      echo "🔨 Installing Node.js dependencies for frontend..."
      cd apps/frontend && npm install
      echo "🔨 Building frontend Next.js..."
      npm run build
      echo "🔨 Cleaning old static files..."
      cd ../..
      rm -rf backend/static/*
      echo "🔨 Copying new build to backend static folder..."
      mkdir -p backend/static
      cp -r apps/frontend/out/* backend/static/
      ls -la backend/static/
      echo "🔨 Installing backend Python dependencies..."
      pip install -r requirements.txt
      echo "✅ Build complete!"
    startCommand: cd backend && python api.py
    envVars:
      - key: ENV_MODE
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://kortix-backend.onrender.com/v1
      - key: PORT
        value: 8000
    healthCheckPath: /v1/health
    plan: starter
