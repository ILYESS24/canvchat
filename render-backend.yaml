services:
  # BACKEND - API FastAPI avec Frontend Next.js intégré
  - type: web
    name: kortix-backend
    env: python
    rootDir: ./
    buildCommand: |
      echo "🔨 Frontend is a static HTML file - no build needed"
      echo "🔨 Installing backend Python dependencies..."
      pip install -r requirements.txt
      echo "✅ Build complete!"
    startCommand: cd backend && python api.py
    envVars:
      - key: ENV_MODE
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://kortix-backend.onrender.com/v1
      - key: PORT
        value: 8000
    healthCheckPath: /v1/health
    plan: starter
