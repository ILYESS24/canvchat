services:
  # Frontend Next.js App
  - type: web
    name: kortix-frontend
    env: node
    rootDir: apps/frontend/
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://kortix-backend.onrender.com/v1
    plan: starter
