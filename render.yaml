# FRONTEND ONLY - Application Next.js complète
# Déploie seulement l'interface frontend (landing page)
services:
  - type: web
    name: kortix-landing-page
    env: node
    rootDir: apps/frontend/
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
    plan: starter
    # Utilise la branche production-ready qui contient seulement la landing page
    branch: production-ready
