name = "suna-frontend"
compatibility_date = "2024-01-01"
pages_build_output_dir = "apps/frontend/out"

[build]
command = "cd apps/frontend && npm run build"
cwd = "."

[build.upload]
format = "service-worker"

[[build.upload.rules]]
type = "ESModule"
globs = ["**/*.js"]

[[build.upload.rules]]
type = "CommonJS"
globs = ["**/*.cjs"]

[vars]
NODE_VERSION = "18"

[build.environment_variables]
NODE_VERSION = "18"
